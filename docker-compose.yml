services:
  postgres:
    image: postgres:16-alpine
    container_name: ssmmss-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ssmmss
      # Prisma writes UTC into `timestamp` columns; keep the server on UTC so
      # CURRENT_TIMESTAMP defaults and raw SQL agree.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

